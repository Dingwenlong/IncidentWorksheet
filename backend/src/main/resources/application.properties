spring.application.name=workorders
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/workorders?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:workorders}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
server.address=${APP_ADDRESS:127.0.0.1}
server.port=${APP_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.time-zone=UTC
server.error.include-message=never
